git:
  repo: "git@github.com:YOUR_ORG/infra-backups.git"
  branch: "main"

  author:
    name: "infra-backup"
    email: "infra@local"

# Optional global dry run (applies to all providers unless overridden)
dry_run: false

providers:
  - type: pfsense
    name: primary
    host: pfsense.lab
    username: ${PFSENSE_USER}
    password: ${PFSENSE_PASS}
    tls: true
    keep_rrd: false
    dry_run: false

  - type: portainer
    name: portainer-main
    url: https://portainer.example.com
    # Option 1: Use an API key
    api_key: ${PORTAINER_API_KEY}
    # Option 2: Use username/password
    username: ${PORTAINER_USER}
    password: ${PORTAINER_PASS}
    timeout: 30
    tls: true
    dry_run: false

  - type: truenas
    name: primary
    host: truenas.lab
    api_key: ${TRUENAS_API_KEY}
    tls: true
    dry_run: false

  - type: unifi
    name: unifi-controller
    url: http://unifi-backup-exporter.unifi.svc.cluster.local:8081
    timeout: 30
    tls: false
    dry_run: false