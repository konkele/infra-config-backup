apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: infra-config-backup-secrets
  namespace: infra-config-backup

spec:
  hostAPI: https://app.infisical.com/api

  syncConfig:
    resyncInterval: 60s
    instantUpdates: false

  authentication:
    universalAuth:
      secretsScope:
        projectSlug: infra-config-backup
        envSlug: default
        secretsPath: /infra-config-backup

      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: infisical

  managedKubeSecretReferences:
    - secretName: infra-config-backup-secrets
      secretNamespace: infra-config-backup
      secretType: Opaque
      creationPolicy: Owner
      template:
        includeAllSecrets: true
