apiVersion: batch/v1
kind: CronJob
metadata:
  name: infra-config-backup
  namespace: infra-config-backup

spec:
  schedule: "0 4 * * *"
  suspend: false

  concurrencyPolicy: Forbid

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 2

      template:
        spec:
          restartPolicy: Never

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault

          containers:
            - name: backup
              image: infra-config-backup:latest

              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL

              env:
                - name: CONFIG_FILE
                  value: /config/config.yaml

              envFrom:
                - secretRef:
                    name: infra-config-backup-secrets

              volumeMounts:
                - name: config
                  mountPath: /config/config.yaml
                  subPath: config.yaml
                  readOnly: true

                - name: ssh
                  mountPath: /config/ssh
                  readOnly: true

          volumes:
            - name: config
              configMap:
                name: infra-config-backup

            - name: ssh
              secret:
                secretName: infra-config-backup-secrets
                items:
                  - key: GIT_SSH_KEY
                    path: id_ed25519
                  - key: GIT_KNOWN_HOSTS
                    path: known_hosts