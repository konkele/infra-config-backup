apiVersion: batch/v1
kind: CronJob
metadata:
  name: infra-config-backup
  namespace: infra-config-backup

spec:
  schedule: "0 4 * * *"
  suspend: false

  concurrencyPolicy: Forbid

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 2

      template:
        spec:
          restartPolicy: Never

          securityContext:
            seccompProfile:
              type: RuntimeDefault

          containers:
            - name: backup
              image: infra-config-backup:latest

              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true

              env:
                - name: CONFIG_FILE
                  value: /config/config.yaml

              envFrom:
                - secretRef:
                    name: infra-config-backup-secrets

              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true

          volumes:
            - name: config
              configMap:
                name: infra-config-backup